<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'none'; object-src 'none'" />
<title>Ryan Field equipment tracker</title>
<style>
  :root {
    --navy: #061433;
    --accent: #d414c8;
    --accent-soft: #ff4de8;
    --bg: #e6edf7;
    --line: #d4deea;
    --muted: #5c6b82;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: linear-gradient(180deg, #f4f7fc 0%, var(--bg) 40%); color: var(--navy); }
  header { position: sticky; top: 0; z-index: 30; background: var(--navy); color: #fff; padding: 14px 22px; display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: 0 8px 24px rgba(6,20,51,.25); }
  h1 { margin: 0; font-size: 1.45rem; letter-spacing: -0.02em; }
  header p { margin: 2px 0 0; color: var(--accent-soft); font-weight: 650; font-size: .92rem; }
  button, select { font: inherit; }
  .reset { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 24px rgba(6,20,51,.05); }
  .stat { padding: 14px 16px; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .value { margin-top: 4px; font-size: 2rem; font-weight: 800; }
  .accent-bar { position: relative; overflow: hidden; }
  .accent-bar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .filters { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; cursor: pointer; background: #eef2f9; color: var(--navy); }
  .chip.on { background: var(--navy); color: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  label.field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 14rem; font-size: .92rem; }
  select { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: #fff; }
  .charts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .chart { padding: 12px 14px 16px; }
  .chart h2 { margin: 0 0 8px; font-size: 1rem; border-bottom: 2px solid var(--navy); display: inline-block; }
  .donut-wrap { display: flex; gap: 10px; align-items: center; }
  .legend { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .plan-card { position: relative; overflow: hidden; }
  .tools { position: absolute; left: 8px; top: 8px; z-index: 5; display: flex; gap: 4px; }
  .tools button { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; cursor: pointer; font-weight: 700; box-shadow: 0 2px 8px rgba(6,20,51,.08); }
  #view { height: min(78vh, 860px); overflow: hidden; background: #f7f4ea; cursor: grab; touch-action: none; overscroll-behavior: contain; }
  #view.drag { cursor: grabbing; }
  #sheet { position: relative; transform-origin: 0 0; }
  #sheet img { display: block; max-width: none; user-select: none; pointer-events: none; }
  .marker { position: absolute; border: 2px solid #fff; border-radius: 50%; padding: 0; box-shadow: 0 1px 4px rgba(0,0,0,.35); transform: translate(-50%, -50%); cursor: pointer; }
  .marker.seat { transform: none; border-radius: 1px; border-width: 1px; box-shadow: none; }
  .key { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 16px; font-size: .92rem; }
  #detail { padding: 12px 16px; }
  #detail h3 { margin: 0; font-size: 1.1rem; }
  #detail p { margin: 4px 0 0; color: var(--muted); }
  #menu { position: fixed; z-index: 50; min-width: 12rem; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(6,20,51,.18); padding: 4px 0; }
  #menu .cap { padding: 6px 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #menu button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: transparent; padding: 8px 12px; cursor: pointer; text-align: left; }
  #menu button:hover { background: #f4f7fb; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Ryan Field</h1>
    <p>Equipment tracker · AV field level</p>
  </div>
  <button class="reset" id="reset" type="button">Reset demo</button>
</header>
<main>
  <section class="stats">
    <div class="card stat"><div class="label">Units on plan</div><div class="value" id="total">0</div></div>
    <div class="card stat"><div class="label">Pending delivery</div><div class="value" id="pending">0</div></div>
    <div class="card stat accent-bar"><div class="label">Status changed</div><div class="value" id="progressed" style="color:var(--accent)">0</div></div>
  </section>
  <section class="card filters">
    <div>
      <div class="label" style="margin-bottom:6px">Bowl</div>
      <div class="chips" id="zones"></div>
    </div>
    <div class="row">
      <label class="field">Equipment
        <select id="equip"></select>
      </label>
      <label class="field">Status
        <select id="status"></select>
      </label>
    </div>
  </section>
  <section class="charts" id="charts"></section>
  <section class="card plan-card">
    <div class="tools">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zreset">Reset</button>
    </div>
    <div id="view">
      <div id="sheet">
        <img id="plan" src="plan.jpg" alt="Ryan Field AV field level plan" />
      </div>
    </div>
  </section>
  <section class="card key" id="key"></section>
  <section class="card hidden" id="detail"></section>
</main>
<div id="menu" class="hidden"></div>

<script>
const STATUSES = [
  { id: "pending", label: "Pending Delivery", color: "#F0E098" },
  { id: "delivered", label: "Delivered", color: "#0080F8" },
  { id: "set", label: "Set in Place", color: "#F800F8" },
  { id: "installed", label: "Installed", color: "#008000" }
];
const STORAGE_KEY = "stadium-demo-status-v1";
const DATA = JSON.parse(document.getElementById("plan-data").textContent);
const items = DATA.items;
let statusMap = {};
let zone = "all";
let nameFilter = "all";
let statusFilter = "all";
let selectedId = null;
let scale = 1;
let pan = { x: 0, y: 0 };
let base = 0.35;
let drag = null;

function seedStatus(item) {
  if (item.category === "Rooms") return "installed";
  const n = item.status % 11;
  if (n >= 9) return "installed";
  if (n >= 7) return "set";
  if (n >= 5) return "delivered";
  return "pending";
}
function statusById(id) { return STATUSES.find((s) => s.id === id) || STATUSES[0]; }
function loadSaved() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { saved = {}; }
  statusMap = {};
  items.forEach((item) => { statusMap[item.id] = saved[item.id] || seedStatus(item); });
}
function visible(item) {
  if (zone !== "all" && item.zone !== zone) return false;
  if (nameFilter !== "all" && item.id !== nameFilter) return false;
  if (statusFilter !== "all" && statusMap[item.id] !== statusFilter) return false;
  return true;
}
function el(tag, text, className) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}
function renderChrome() {
  const zones = [...new Set(items.map((i) => i.zone))];
  const zoneBox = document.getElementById("zones");
  zoneBox.replaceChildren();
  [["all", "All areas"], ...zones.map((z) => [z, z])].forEach(([id, label]) => {
    const b = el("button", label, "chip" + (zone === id ? " on" : ""));
    b.type = "button";
    b.onclick = () => { zone = id; render(); };
    zoneBox.appendChild(b);
  });
  const equip = document.getElementById("equip");
  const prev = nameFilter;
  equip.replaceChildren();
  const allOpt = el("option", "All");
  allOpt.value = "all";
  equip.appendChild(allOpt);
  items.forEach((i) => {
    if (i.category === "Seats") return;
    const o = el("option", i.name + " · " + i.zone);
    o.value = i.id;
    equip.appendChild(o);
  });
  equip.value = prev;
  const status = document.getElementById("status");
  if (!status.dataset.ready) {
    status.replaceChildren();
    const allStatus = el("option", "All");
    allStatus.value = "all";
    status.appendChild(allStatus);
    STATUSES.forEach((s) => {
      const o = el("option", s.label);
      o.value = s.id;
      status.appendChild(o);
    });
    status.dataset.ready = "1";
    status.onchange = () => { statusFilter = status.value; render(); };
    equip.onchange = () => { nameFilter = equip.value; render(); };
  }
  status.value = statusFilter;
  const key = document.getElementById("key");
  key.replaceChildren();
  STATUSES.forEach((s) => {
    const span = el("span");
    const sw = el("span", "", "swatch");
    sw.style.background = s.color;
    span.append(sw, document.createTextNode(s.label));
    key.appendChild(span);
  });
  const hint = el("span", "Click a marker to set status. Scroll zooms the plan only.");
  hint.style.color = "var(--muted)";
  key.appendChild(hint);
}
function renderCharts() {
  const box = document.getElementById("charts");
  const cats = [...new Set(items.map((i) => i.category))];
  box.replaceChildren();
  cats.forEach((cat) => {
    const group = items.filter((i) => i.category === cat);
    const counts = STATUSES.map((s) => group.filter((i) => statusMap[i.id] === s.id).length);
    const total = group.length || 1;
    const article = el("article", null, "card chart");
    const h2 = el("h2", cat);
    const wrap = el("div", null, "donut-wrap");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", "108");
    svg.setAttribute("height", "108");
    svg.setAttribute("viewBox", "0 0 108 108");
    let offset = 0;
    const r = 42, c = 2 * Math.PI * r;
    STATUSES.forEach((s, idx) => {
      const len = (counts[idx] / total) * c;
      const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      ring.setAttribute("cx", "54");
      ring.setAttribute("cy", "54");
      ring.setAttribute("r", String(r));
      ring.setAttribute("fill", "none");
      ring.setAttribute("stroke", s.color);
      ring.setAttribute("stroke-width", "16");
      ring.setAttribute("stroke-dasharray", len + " " + (c - len));
      ring.setAttribute("stroke-dashoffset", String(-offset));
      ring.setAttribute("transform", "rotate(-90 54 54)");
      svg.appendChild(ring);
      offset += len;
    });
    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("x", "54");
    label.setAttribute("y", "58");
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("font-size", "16");
    label.setAttribute("font-weight", "800");
    label.setAttribute("fill", "#061433");
    label.textContent = String(group.length);
    svg.appendChild(label);
    const legend = el("div", null, "legend");
    STATUSES.forEach((s, idx) => {
      const row = el("div");
      const sw = el("span", "", "swatch");
      sw.style.background = s.color;
      row.append(sw, document.createTextNode(s.label + " " + counts[idx]));
      legend.appendChild(row);
    });
    wrap.append(svg, legend);
    article.append(h2, wrap);
    box.appendChild(article);
  });
}
function renderMarkers() {
  const sheet = document.getElementById("sheet");
  sheet.querySelectorAll(".marker").forEach((n) => n.remove());
  items.forEach((item) => {
    const on = visible(item);
    const status = statusById(statusMap[item.id] || "pending");
    const b = document.createElement("button");
    b.type = "button";
    b.className = item.shape === "rect" ? "marker seat" : "marker";
    b.title = item.name + " · " + status.label;
    const size = item.category === "Rooms" ? 22 : 14;
    b.style.left = item.x + "px";
    b.style.top = item.y + "px";
    b.style.width = (item.shape === "rect" ? item.w : size) + "px";
    b.style.height = (item.shape === "rect" ? item.h : size) + "px";
    b.style.background = on ? status.color : "transparent";
    b.style.opacity = on ? "0.92" : "0.15";
    if (selectedId === item.id) b.style.outline = "2px solid #061433";
    b.onclick = (e) => {
      e.stopPropagation();
      selectedId = item.id;
      openMenu(item.id, e.clientX, e.clientY);
      render();
    };
    sheet.appendChild(b);
  });
}
function renderDetail() {
  const box = document.getElementById("detail");
  const item = items.find((i) => i.id === selectedId);
  if (!item) { box.classList.add("hidden"); box.replaceChildren(); return; }
  const status = statusById(statusMap[item.id] || "pending");
  box.classList.remove("hidden");
  const title = el("h3", item.name);
  const meta = el("p", item.category + " · " + item.zone + " · " + item.tag);
  const state = el("p", status.label);
  state.style.color = "var(--navy)";
  state.style.fontWeight = "700";
  box.replaceChildren(title, meta, state);
}
function render() {
  const shown = items.filter(visible);
  document.getElementById("total").textContent = shown.length;
  document.getElementById("pending").textContent = shown.filter((i) => statusMap[i.id] === "pending").length;
  document.getElementById("progressed").textContent = shown.filter((i) => statusMap[i.id] && statusMap[i.id] !== "pending").length;
  renderChrome();
  renderCharts();
  renderMarkers();
  renderDetail();
  applyTransform();
}
function applyTransform() {
  document.getElementById("sheet").style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${base * scale})`;
}
function fit() {
  const view = document.getElementById("view");
  const w = view.clientWidth || 800;
  const h = view.clientHeight || 600;
  base = Math.min(w / DATA.width, h / DATA.height);
  applyTransform();
}
function openMenu(id, x, y) {
  const menu = document.getElementById("menu");
  menu.classList.remove("hidden");
  menu.style.left = Math.min(x, window.innerWidth - 220) + "px";
  menu.style.top = Math.min(y, window.innerHeight - 220) + "px";
  menu.replaceChildren(el("div", "Set status", "cap"));
  STATUSES.forEach((s) => {
    const btn = el("button");
    btn.type = "button";
    const sw = el("span", "", "swatch");
    sw.style.background = s.color;
    btn.append(sw, document.createTextNode(s.label));
    btn.onclick = () => {
      if (!STATUSES.some((row) => row.id === s.id)) return;
      statusMap[id] = s.id;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(statusMap));
      menu.classList.add("hidden");
      render();
    };
    menu.appendChild(btn);
  });
}
document.getElementById("plan").width = DATA.width;
document.getElementById("plan").height = DATA.height;
document.getElementById("sheet").style.width = DATA.width + "px";
document.getElementById("sheet").style.height = DATA.height + "px";
loadSaved();
render();
fit();
window.addEventListener("resize", fit);
document.getElementById("zin").onclick = () => { scale = Math.min(6, scale * 1.2); applyTransform(); };
document.getElementById("zout").onclick = () => { scale = Math.max(0.4, scale / 1.2); applyTransform(); };
document.getElementById("zreset").onclick = () => { scale = 1; pan = { x: 0, y: 0 }; applyTransform(); };
document.getElementById("reset").onclick = () => {
  localStorage.removeItem(STORAGE_KEY);
  selectedId = null;
  zone = "all";
  nameFilter = "all";
  statusFilter = "all";
  loadSaved();
  render();
};
const view = document.getElementById("view");
view.addEventListener("wheel", (e) => {
  e.preventDefault();
  e.stopPropagation();
  const next = e.deltaY < 0 ? scale * 1.12 : scale / 1.12;
  scale = Math.min(6, Math.max(0.4, next));
  applyTransform();
}, { passive: false });
view.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".marker")) return;
  drag = { x: e.clientX, y: e.clientY, px: pan.x, py: pan.y };
  view.classList.add("drag");
  view.setPointerCapture(e.pointerId);
});
view.addEventListener("pointermove", (e) => {
  if (!drag) return;
  pan = { x: drag.px + (e.clientX - drag.x), y: drag.py + (e.clientY - drag.y) };
  applyTransform();
});
view.addEventListener("pointerup", () => { drag = null; view.classList.remove("drag"); });
document.addEventListener("pointerdown", (e) => {
  if (!e.target.closest("#menu") && !e.target.closest(".marker")) {
    document.getElementById("menu").classList.add("hidden");
  }
});
</script>
</body>
